<div class="flex flex-col">
  <label class="mb-2 text-sm font-medium" [for]="idControl()">{{ etiqueta() }}</label>
  <ng-content />
  <div aria-live="polite">
    @if (error(); as mensaje) {
      <p class="mt-2 text-sm text-red-700" [id]="idControl() + '-error'">{{ mensaje }}</p>
    }
  </div>
</div>
