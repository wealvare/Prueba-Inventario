<main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-4 py-12">
  <h1 class="text-2xl font-semibold tracking-tight text-neutral-900">Inventario</h1>
  <p class="mt-2 text-sm text-neutral-600">Inicia sesión para continuar.</p>

  <form class="mt-8 flex flex-col gap-5" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
    @let usuario = formulario.controls.nombreUsuario;
    @let contrasena = formulario.controls.contrasena;

    <app-campo idControl="usuario" etiqueta="Usuario" [error]="mensaje(usuario)">
      <input
        id="usuario"
        type="text"
        class="campo"
        autocomplete="username"
        aria-describedby="usuario-error"
        [formControl]="usuario"
        [attr.aria-invalid]="mensaje(usuario) !== null"
      />
    </app-campo>

    <app-campo idControl="contrasena" etiqueta="Contraseña" [error]="mensaje(contrasena)">
      <input
        id="contrasena"
        type="password"
        class="campo"
        autocomplete="current-password"
        aria-describedby="contrasena-error"
        [formControl]="contrasena"
        [attr.aria-invalid]="mensaje(contrasena) !== null"
      />
    </app-campo>

    @if (errorServidor(); as error) {
      <p role="alert" class="aviso-error">{{ error }}</p>
    }

    <button type="submit" class="boton-principal" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
